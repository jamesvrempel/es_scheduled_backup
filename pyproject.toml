[project]
name = "es_scheduled_backup"
authors = [
    { name = "Enterprise Systems AU", email = "accounts@enterprisesystems.com.au" }
]
description = "Scheduled backup of a site, pushed to a second server and restored there as a working copy."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
